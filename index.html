<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Famio">
<meta name="theme-color" content="#2f6fed">
<title>Famio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍👩‍👧‍👦</text></svg>">
<style>
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f0f3f9;
    --text:#1a2233; --muted:#6a7488; --border:#e3e8f0;
    --accent:#2f6fed; --accent-weak:#e7efff;
    --green:#1f9d57; --green-weak:#e4f6ec;
    --amber:#d98313; --amber-weak:#fdf0dd;
    --red:#d64545; --red-weak:#fbe6e6;
    --violet:#8a5cf6; --pink:#e26aa7;
    --radius:16px; --shadow:0 2px 10px rgba(20,30,60,.06),0 8px 30px rgba(20,30,60,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1420; --surface:#171d2b; --surface-2:#1f2638;
      --text:#e8ecf5; --muted:#99a3b8; --border:#2a3346;
      --accent:#5b8dfd; --accent-weak:#1c2740;
      --green:#49c47d; --green-weak:#18312a;
      --amber:#e0a44a; --amber-weak:#33281a;
      --red:#ee6a6a; --red-weak:#331f22;
      --violet:#a784ff; --pink:#f08cc0;
      --shadow:0 2px 10px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.25);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
  .brand .logo{font-size:24px}
  .topbar .spacer{flex:1}
  .icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .icon-btn:hover{background:var(--surface-2)}

  .nav{display:flex;gap:4px;padding:10px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;overflow-x:auto}
  .nav button{border:none;background:none;color:var(--muted);font-weight:600;font-size:15px;padding:10px 14px;border-bottom:3px solid transparent;transition:.15s;white-space:nowrap}
  .nav button.active{color:var(--accent);border-bottom-color:var(--accent)}

  main{max-width:1100px;margin:0 auto;padding:22px 20px 70px}
  h2.section{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:26px 0 12px}
  h2.section:first-child{margin-top:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
  .member-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:center;transition:.15s;position:relative}
  .member-card:hover{transform:translateY(-3px)}
  .avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;object-fit:cover;background:linear-gradient(135deg,var(--accent),#7aa6ff);display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .member-card .name{font-weight:700;font-size:16px}
  .member-card .age{color:var(--muted);font-size:14px;margin-top:2px}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-top:10px}
  .chip.ok{background:var(--green-weak);color:var(--green)}
  .chip.care{background:var(--amber-weak);color:var(--amber)}
  .add-tile{border:2px dashed var(--border);border-radius:var(--radius);background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px;font-weight:600}
  .add-tile:hover{border-color:var(--accent);color:var(--accent)}
  .add-tile .plus{font-size:34px;line-height:1}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
  .stat .num{font-size:30px;font-weight:800;line-height:1}
  .stat .lbl{color:var(--muted);font-size:13px;margin-top:6px;font-weight:600}
  .stat.accent .num{color:var(--accent)} .stat.amber .num{color:var(--amber)} .stat.green .num{color:var(--green)} .stat.violet .num{color:var(--violet)}

  .reminders{background:var(--amber-weak);border:1px solid var(--amber);border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .reminders h4{color:var(--amber);font-size:14px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .reminders .rem{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}
  .reminders .rem.urgent{font-weight:700}

  .back{background:none;border:none;color:var(--accent);font-weight:600;font-size:15px;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
  .profile-hero{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;flex-wrap:wrap}
  .profile-hero .avatar{width:88px;height:88px;font-size:42px;margin:0}
  .profile-hero .h-name{font-size:22px;font-weight:700}
  .profile-hero .h-sub{color:var(--muted);margin-top:2px}
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .badge{background:var(--surface-2);border-radius:10px;padding:6px 12px;font-size:13px}
  .badge b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .badge.warn{background:var(--amber-weak);color:var(--amber)}

  .tabs{display:flex;gap:4px;margin:20px 0 4px;border-bottom:1px solid var(--border);overflow-x:auto}
  .tabs button{border:none;background:none;color:var(--muted);font-weight:600;font-size:15px;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .card.left-accent{border-left:4px solid var(--accent)}
  .card.left-amber{border-left:4px solid var(--amber)}
  .card.left-green{border-left:4px solid var(--green)}
  .card .row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .card h4{font-size:17px}
  .card .date{color:var(--muted);font-size:13px;white-space:nowrap}
  .card p.desc{color:var(--muted);font-size:14px;margin-top:6px}

  .med{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px}
  .med .mname{font-weight:600}
  .med .mdetail{color:var(--muted);font-size:13px;margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
  .rx-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rx-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer}

  .empty{text-align:center;color:var(--muted);padding:34px 16px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .list-add{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px;transition:.15s}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.soft{background:var(--accent-weak);color:var(--accent)}
  .btn.ghost{background:var(--surface-2);color:var(--text)}
  .btn.danger{background:var(--red-weak);color:var(--red)}
  .btn.block{width:100%}
  .btn.sm{padding:7px 12px;font-size:13px}
  .mini-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  .agenda-item{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
  .datebox{width:58px;min-width:58px;height:58px;border-radius:12px;background:var(--accent-weak);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .datebox .d{font-size:22px;font-weight:800;line-height:1}
  .datebox .m{font-size:11px;text-transform:uppercase;font-weight:700;margin-top:2px}
  .agenda-item .ai-title{font-weight:700}
  .agenda-item .ai-sub{color:var(--muted);font-size:13px;margin-top:2px}
  .cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .cal-head .title{font-size:20px;font-weight:800;text-transform:capitalize;flex:1;text-align:center}
  .cal-nav{border:1px solid var(--border);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:18px;color:var(--text)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px 0}
  .cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.12s;overflow:hidden}
  .cal-cell:hover{border-color:var(--accent)}
  .cal-cell.other{opacity:.4}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak) inset}
  .cal-cell .dnum{font-size:13px;font-weight:700;align-self:flex-end}
  .cal-ev{font-size:11px;font-weight:600;color:#fff;border-radius:5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-more{font-size:10px;color:var(--muted);font-weight:700}
  @media(max-width:620px){.cal-cell{min-height:64px}.cal-ev{font-size:0;padding:4px}}

  .reftable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .reftable th,.reftable td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px}
  .reftable th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .reftable tr:last-child td{border-bottom:none}

  .bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding:10px 4px 0}
  .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar{width:70%;max-width:34px;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px;transition:.2s;position:relative}
  .bar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--text)}
  .bar-lbl{font-size:10px;color:var(--muted);font-weight:600}

  .overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  @media(min-width:640px){.overlay{align-items:center;padding:20px}}
  .modal{background:var(--surface);width:100%;max-width:540px;border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:92vh;overflow:auto}
  @media(min-width:640px){.modal{border-radius:20px}}
  .modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
  .modal header h3{font-size:18px}
  .modal .close{background:var(--surface-2);border:none;border-radius:8px;width:32px;height:32px;font-size:18px;color:var(--muted)}
  .modal .body{padding:20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .field textarea{resize:vertical;min-height:72px}
  .field .hint{color:var(--muted);font-size:12px;margin-top:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}
  .photo-pick{display:flex;align-items:center;gap:14px}
  .photo-pick .avatar{width:64px;height:64px;font-size:30px;margin:0}
  .modal footer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}
  .modal footer .btn{flex:1}
  .setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
  .setrow:last-child{border-bottom:none}
  .setrow .st{font-weight:600}.setrow .sd{color:var(--muted);font-size:13px;margin-top:2px}

  .ecard{border:2px solid var(--red);border-radius:14px;padding:16px;margin-bottom:14px}
  .ecard h4{color:var(--red);display:flex;align-items:center;gap:8px}
  .ecard .erow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:14px}
  .ecard .erow .k{color:var(--muted);min-width:120px;font-weight:600}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  input[type=file]{display:none}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}

  /* Lock screen */
  .lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
  .lock .logo{font-size:56px}
  .lock h2{font-size:20px}
  .lock input{font-size:28px;letter-spacing:10px;text-align:center;width:200px;padding:12px;border:2px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)}
  .lock input:focus{outline:none;border-color:var(--accent)}
  .lock .err{color:var(--red);font-weight:600;height:20px}

  @media print{
    .topbar,.nav,main,.toast{display:none!important}
    .overlay{position:static;background:none;display:block;padding:0}
    .modal{box-shadow:none;max-height:none;max-width:none;border:none}
    .modal header .close,.modal footer{display:none!important}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo">👨‍👩‍👧‍👦</span><span>Famio <small style="opacity:.45;font-size:11px;font-weight:700">v6</small></span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnSettings" title="Réglages">⚙️</button>
  <button class="icon-btn" id="btnOpen" title="Ouvrir un fichier de données">📂</button>
  <button class="icon-btn" id="btnSaveFile" title="Enregistrer dans un fichier">💾</button>
</div>
<div class="nav">
  <button data-view="home" class="active">👥 Famille</button>
  <button data-view="health">🏥 Santé</button>
  <button data-view="calendar">📅 Calendrier</button>
</div>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Stockage local (IndexedDB) ---------------- */
const DB_NAME='familleDB', STORE='app', KEY='state';
const EMPTY={members:[],health:[],events:[],vaccines:[],measurements:[],settings:{}};
let state=JSON.parse(JSON.stringify(EMPTY));

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbGet(){return openDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);}));}
function idbPut(v){return openDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite').objectStore(STORE).put(v,KEY);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);}));}
let masterPw=null, fileHandle=null;
const hasSaveFSA=('showSaveFilePicker'in window), hasOpenFSA=('showOpenFilePicker'in window);
async function saveState(){
  if(masterPw==null)return;
  try{
    const pkg=await encryptPkg(state,masterPw);
    await idbPut(pkg);
    if(fileHandle){try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(pkg));await w.close();}catch(e){console.warn('écriture fichier',e);}}
  }catch(e){console.warn('Sauvegarde impossible',e);toast('⚠️ Sauvegarde impossible');}
}

/* ---------------- Utilitaires ---------------- */
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONTHS_FULL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DOW=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function parseD(s){return s?new Date(s+'T00:00:00'):null;}
function fmtDate(s){const d=parseD(s);if(!d)return'';return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function todayStr(){return ymd(new Date());}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysBetween(a,b){return Math.round((parseD(a)-parseD(b))/86400000);}
function ageYears(dob){const b=parseD(dob);if(!b)return null;const n=new Date();let y=n.getFullYear()-b.getFullYear();const md=n.getMonth()-b.getMonth();if(md<0||(md===0&&n.getDate()<b.getDate()))y--;return y;}
function ageText(dob){const b=parseD(dob);if(!b)return'';let y=ageYears(dob);if(y<2){const n=new Date();let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());if(n.getDate()<b.getDate())m--;return Math.max(0,m)+' mois';}return y+' ans';}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(name){return(name||'?').split(' ').map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function avatarHTML(m,cls=''){if(m&&m.photo)return`<div class="avatar ${cls}"><img src="${m.photo}" alt=""></div>`;return`<div class="avatar ${cls}">${m&&m.name?esc(initials(m.name)):'👤'}</div>`;}
function memberName(id){const m=state.members.find(x=>x.id===id);return m?m.name:'';}
function resizeImage(file,max,quality){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('read'));r.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('decode'));img.onload=()=>{try{let{width:w,height:h}=img;if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',quality));}catch(e){rej(e);}};img.src=r.result;};r.readAsDataURL(file);});}
function withTimeout(promise,ms){return Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=e=>{if(e.target.files[0])cb(e.target.files[0]);};i.click();}
function openImage(src){const lb=document.createElement('div');lb.className='lightbox';lb.innerHTML=`<img src="${src}">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb);}

const CATS={rdv:{label:'Rendez-vous',emoji:'🩺',color:'#2f6fed'},vacances:{label:'Vacances',emoji:'🏖️',color:'#1f9d57'},scolaire:{label:'Scolaire',emoji:'🎒',color:'#d98313'},prive:{label:'Privé',emoji:'🎉',color:'#8a5cf6'},autre:{label:'Autre',emoji:'📌',color:'#6a7488'}};

function isTreatmentActive(h){return !h.endDate||parseD(h.endDate)>=new Date(new Date().toDateString());}
function activeMeds(){const out=[];state.health.forEach(h=>{if(isTreatmentActive(h))(h.meds||[]).forEach(md=>out.push({med:md,health:h}));});return out;}

/* ---------------- Rappels ---------------- */
function computeReminders(){
  const out=[];const today=todayStr();
  state.events.filter(e=>e.category==='rdv'&&e.date).forEach(e=>{const dd=daysBetween(e.date,today);if(dd>=0&&dd<=7)out.push({icon:'🩺',urgent:dd<=1,text:`${e.title}${memberName(e.memberId)?' ('+memberName(e.memberId)+')':''} — ${dd===0?"aujourd'hui":dd===1?'demain':'le '+fmtDate(e.date)}`});});
  (state.vaccines||[]).filter(v=>v.nextDate).forEach(v=>{const dd=daysBetween(v.nextDate,today);if(dd<=30)out.push({icon:'💉',urgent:dd<=0,text:`Rappel vaccin ${v.name} (${memberName(v.memberId)}) — ${dd<0?'en retard ('+fmtDate(v.nextDate)+')':dd===0?"aujourd'hui":'le '+fmtDate(v.nextDate)}`});});
  out.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
  return out;
}
function maybeNotify(){
  const s=state.settings||{};if(!s.notif||!('Notification'in window)||Notification.permission!=='granted')return;
  const urgent=computeReminders().filter(r=>r.urgent);
  if(urgent.length){try{new Notification('Famio — à ne pas oublier',{body:urgent.slice(0,3).map(r=>r.text).join('\n')});}catch(e){}}
}

/* ---------------- Chiffrement (AES-GCM + PBKDF2) ---------------- */
function b64(buf){let s='';const b=new Uint8Array(buf);const c=0x8000;for(let i=0;i<b.length;i+=c)s+=String.fromCharCode.apply(null,b.subarray(i,i+c));return btoa(s);}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptPkg(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(pw,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{app:'famille',enc:true,v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)};}
async function decryptPkg(pkg,pw){const key=await deriveKey(pw,unb64(pkg.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pkg.iv)},key,unb64(pkg.data));return JSON.parse(new TextDecoder().decode(pt));}

/* ---------------- Fichier sur disque ---------------- */
async function saveToFile(){
  if(masterPw==null){toast('Crée d\'abord un mot de passe');return;}
  const text=JSON.stringify(await encryptPkg(state,masterPw));
  if(hasSaveFSA){
    try{
      if(!fileHandle)fileHandle=await window.showSaveFilePicker({suggestedName:'famio.famdb',types:[{description:'Données Famio (chiffré)',accept:{'application/octet-stream':['.famdb']}}]});
      const w=await fileHandle.createWritable();await w.write(text);await w.close();toast('✅ Fichier enregistré');return;
    }catch(e){if(e.name==='AbortError')return;console.warn(e);}
  }
  const blob=new Blob([text],{type:'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='famio.famdb';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Fichier téléchargé — range-le dans iCloud/OneDrive');
}
async function openFromFile(){
  let text=null;
  if(hasOpenFSA){
    try{const [h]=await window.showOpenFilePicker({types:[{description:'Données Famio',accept:{'application/octet-stream':['.famdb','.json']}}]});fileHandle=h;text=await (await h.getFile()).text();}
    catch(e){if(e.name==='AbortError')return;}
  }
  if(text==null){text=await new Promise(res=>pickFile('.famdb,.json,application/octet-stream,application/json',f=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsText(f);}));if(!text)return;}
  let pkg;try{pkg=JSON.parse(text);}catch(e){toast('⚠️ Fichier illisible');return;}
  if(!pkg||!pkg.enc){toast('⚠️ Fichier non reconnu');return;}
  showGate({title:'Ouvrir le fichier',sub:'Entre le mot de passe de ce fichier',create:false,allowCancel:true,onSubmit:async(pw)=>{
    try{const data=await decryptPkg(pkg,pw);state=Object.assign(JSON.parse(JSON.stringify(EMPTY)),data);masterPw=pw;await saveState();document.querySelectorAll('.lock').forEach(l=>l.remove());view={name:'home'};setNav();render();maybeNotify();toast('Fichier chargé');return null;}
    catch(e){return 'Mot de passe incorrect';}
  }});
}

function renderHealth(){

  let rdv=`<h2 class="section">Prochains rendez-vous</h2>`;const up=rdvUp.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,6);
  rdv+=up.length?up.map(e=>{const d=parseD(e.date);return `<div class="agenda-item"><div class="datebox"><span class="d">${d.getDate()}</span><span class="m">${MONTHS[d.getMonth()]}</span></div><div style="flex:1"><div class="ai-title">${esc(e.title)}</div><div class="ai-sub">${esc([memberName(e.memberId),e.doctor].filter(Boolean).join(' · '))}</div></div></div>`;}).join(''):`<div class="empty">Aucun rendez-vous prévu</div>`;
  const counts=new Array(12).fill(0);const labels=[];const base=new Date();base.setDate(1);
  for(let i=11;i>=0;i--){const d=new Date(base.getFullYear(),base.getMonth()-i,1);labels.push(MONTHS[d.getMonth()]);}
  state.health.forEach(h=>{const d=parseD(h.startDate);if(!d)return;const diff=(base.getFullYear()-d.getFullYear())*12+(base.getMonth()-d.getMonth());if(diff>=0&&diff<12)counts[11-diff]++;});
  const maxC=Math.max(1,...counts);

  const ref=`<table class="reftable"><tr><th>Membre</th><th>Groupe sanguin</th><th>Allergies</th></tr>${refRows}</table>`;
  return `${stats}${remHtml}${treat}${rdv}<h2 class="section">Maladies sur 12 mois</h2>${bars}<h2 class="section">Infos vitales (allergies & groupes sanguins)</h2>${ref}<div class="list-add" style="margin-top:16px"><button class="btn primary" id="scanRx">📷 Scanner une ordonnance</button><button class="btn danger" id="emergencyBtn">🚨 Fiche d'urgence imprimable</button></div>`;

function lineChart(vals,color,unit){
  if(vals.length<2)return `<div class="empty" style="padding:16px">Ajoute au moins 2 mesures pour voir la courbe</div>`;
  const w=320,h=140,pad=28;const ys=vals.map(v=>v.y);const min=Math.min(...ys),max=Math.max(...ys);const range=(max-min)||1;const stepX=(w-pad*2)/(vals.length-1);
  const pts=vals.map((v,i)=>[pad+i*stepX, h-pad-((v.y-min)/range)*(h-pad*2)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"/>`).join('');
  const last=vals[vals.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="4" y="16" font-size="11" fill="#8a94a8">${max}${unit}</text><text x="4" y="${h-8}" font-size="11" fill="#8a94a8">${min}${unit}</text><text x="${w-4}" y="16" font-size="12" font-weight="700" fill="${color}" text-anchor="end">${last.y}${unit}</text></svg>`;
}

function birthdaysForDay(dateStr){const d=parseD(dateStr);return state.members.filter(m=>{const b=parseD(m.dob);return b&&b.getDate()===d.getDate()&&b.getMonth()===d.getMonth();});}

function renderCalendar(){
  if(view.mode==='liste')return renderAgendaList();
  const y=view.y,m=view.m;const first=new Date(y,m,1);let startDow=(first.getDay()+6)%7;const daysInMonth=new Date(y,m+1,0).getDate();const todayS=todayStr();
  let cells='';for(let i=0;i<startDow;i++){const d=new Date(y,m,1-startDow+i);cells+=dayCell(d,true,todayS);}
  for(let day=1;day<=daysInMonth;day++)cells+=dayCell(new Date(y,m,day),false,todayS);
  const total=startDow+daysInMonth;const trail=(7-total%7)%7;for(let i=1;i<=trail;i++)cells+=dayCell(new Date(y,m+1,i),true,todayS);
  const head=`<div class="cal-head"><button class="cal-nav" id="prevM">‹</button><div class="title">${MONTHS_FULL[m]} ${y}</div><button class="cal-nav" id="nextM">›</button></div>`;
  const toggle=`<div class="list-add" style="justify-content:space-between;margin-bottom:12px"><button class="btn primary" id="addEvent">+ Ajouter un événement</button><div><button class="btn ghost sm" id="toList">☰ Liste</button> <button class="btn ghost sm" id="todayBtn">Aujourd'hui</button></div></div>`;
  const dows=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  return `${toggle}${head}<div class="cal-grid">${dows}${cells}</div>`;
}
function dayCell(d,other,todayS){const ds=ymd(d);const evs=eventsForDay(ds);const isToday=ds===todayS;const shown=evs.slice(0,3).map(e=>{const c=e._cat==='anniv'?{color:'#e26aa7'}:(CATS[e._cat]||CATS.autre);return `<div class="cal-ev" style="background:${c.color}">${esc(e.title)}</div>`;}).join('');const more=evs.length>3?`<div class="cal-more">+${evs.length-3}</div>`:'';return `<div class="cal-cell ${other?'other':''} ${isToday?'today':''}" data-day="${ds}"><div class="dnum">${d.getDate()}</div>${shown}${more}</div>`;}
function renderAgendaList(){
  const items=state.events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));const now=new Date(new Date().toDateString());
  const up=items.filter(e=>parseD(e.endDate||e.date)>=now),past=items.filter(e=>parseD(e.endDate||e.date)<now).reverse();
  const item=e=>{const d=parseD(e.date);const c=CATS[e.category]||CATS.autre;const sub=[c.label,memberName(e.memberId),e.doctor,e.endDate?('→ '+fmtDate(e.endDate)):'',e.notes].filter(Boolean).join(' · ');return `<div class="agenda-item"><div class="datebox" style="background:${c.color}22;color:${c.color}"><span class="d">${d?d.getDate():'?'}</span><span class="m">${d?MONTHS[d.getMonth()]:''}</span></div><div style="flex:1"><div class="ai-title"><span class="cat-dot" style="background:${c.color}"></span>${esc(e.title)}</div><div class="ai-sub">${esc(sub)}</div></div><button class="btn ghost sm" data-editevent="${e.id}">Modifier</button></div>`;};
  const toggle=`<div class="list-add" style="justify-content:space-between;margin-bottom:12px"><button class="btn primary" id="addEvent">+ Ajouter un événement</button><button class="btn ghost sm" id="toMonth">▦ Mois</button></div>`;
  let html=toggle+`<h2 class="section">À venir</h2>`+(up.length?up.map(item).join(''):`<div class="empty"><div class="big">📅</div>Rien de prévu</div>`);
  if(past.length)html+=`<h2 class="section">Passé</h2>`+past.map(item).join('');return html;
}

function loadTesseract(){
  return new Promise((res,rej)=>{
    if(window.Tesseract)return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=()=>res();s.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(s);

}
function scanProgress(show,pct){
  let o=document.getElementById('scanov');
  if(show){
    if(!o){o=document.createElement('div');o.id='scanov';o.className='lock';o.innerHTML=`<div class="logo">📷</div><h2>Lecture de l'ordonnance…</h2><div id="scanpct" style="color:var(--muted)">Préparation…</div><div style="color:var(--muted);font-size:13px;max-width:320px;text-align:center">La lecture se fait sur ton appareil. Ça peut prendre jusqu'à une minute.</div>`;document.body.appendChild(o);}
    if(pct!=null)o.querySelector('#scanpct').textContent=pct+' %';
  }else if(o)o.remove();
}
function parseRx(text){
  const lower=text.toLowerCase();let memberId=null;
  for(const m of state.members){const fn=(m.name.split(' ')[0]||'').toLowerCase();if(fn.length>=3&&lower.includes(fn)){memberId=m.id;break;}}
  let date='';const dm=text.match(/(\d{1,2})[\/.\- ](\d{1,2})[\/.\- ](\d{2,4})/);
  if(dm){let dd=dm[1],mm=dm[2],yy=dm[3];if(yy.length===2)yy='20'+yy;date=`${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;}
  let doctor='';const dr=text.match(/(?:Dr|Docteur|Dr\.)\s*\.?\s*([A-ZÉÈÀ][A-Za-zéèêàÉÈ'\-]+(?:\s+[A-ZÉÈÀ][A-Za-zéèêàÉÈ'\-]+)?)/);
  if(dr)doctor='Dr '+dr[1].trim();
  let durN=0,durUnit='';const du=lower.match(/pendant\s+(\d+)\s*(jour|semaine|mois)/);
  if(du){durN=+du[1];durUnit=du[2];}
  return {memberId,date,doctor,durN,durUnit,text:text.trim()};
}
function computeEnd(start,n,unit){const d=parseD(start);if(!d||!n)return'';if(unit==='semaine')d.setDate(d.getDate()+n*7);else if(unit==='mois')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+n);return ymd(d);}
const COMMON_MEDS=['doliprane','paracétamol','paracetamol','efferalgan','dafalgan','advil','ibuprofène','ibuprofene','nurofen','amoxicilline','augmentin','clamoxyl','smecta','spasfon','ventoline','aerius','clarityne','maalox','gaviscon','motilium','imodium','toplexil','azithromycine','solupred','célestène','celestene','orelox','cétirizine','cetirizine','desloratadine','humex','forlax','josacine','rhinofluimucil','mucomyst','pivalone','cortancyl','vogalene','débridat','debridat'];
function detectMeds(text){
  const out=[],seen=new Set();
  (text||'').split(/\n+/).forEach(raw=>{
    const line=raw.trim();if(line.length<3)return;
    const lower=line.toLowerCase();
    const doseM=line.match(/(\d+[.,]?\d*)\s?(mg|g|ml|µg|mcg|ui|%)\b/i);
    const known=COMMON_MEDS.find(k=>lower.includes(k));
    if(!doseM&&!known)return;
    let name='';
    if(known)name=known.charAt(0).toUpperCase()+known.slice(1);
    else{let before=line.slice(0,doseM.index).replace(/^[\-•*·\d.\)\s]+/,'').trim();name=(before.split(/\s{2,}|,|;/)[0]||'').trim();if(name.length<2)name=line.replace(/^[\-•*·\d.\)\s]+/,'').trim().slice(0,40);}
    if(!name)return;
    const key=name.toLowerCase();if(seen.has(key))return;seen.add(key);
    const dose=doseM?doseM[1].replace(',','.'):'';const unit=doseM?doseM[2].toLowerCase():'';
    let perDay='';const pd=lower.match(/(\d+)\s*(?:fois|x)\s*(?:par|\/)?\s*jour/);
    if(pd)perDay=pd[1];else{let c=0;if(/\bmatin\b/.test(lower))c++;if(/\bmidi\b/.test(lower))c++;if(/\bsoir\b/.test(lower))c++;if(c)perDay=String(c);}
    let durationDays='';const du=lower.match(/pendant\s+(\d+)\s*(jour|semaine|mois)/);
    if(du){const n=+du[1];durationDays=String(du[2]==='semaine'?n*7:du[2]==='mois'?n*30:n);}
    out.push({name,dose,unit,perDay,durationDays});
  });
  return out.slice(0,12);
}
async function scanOrdonnance(){
  if(!state.members.length){toast('Ajoute d\'abord un membre');return;}
  pickFile('image/*',async f=>{
    let photo;try{photo=await resizeImage(f,1600,0.9);}catch(e){toast('Image illisible');return;}
    scanProgress(true,0);
    let text='';
    try{
      await withTimeout(loadTesseract(),25000);
      const r=await withTimeout(Tesseract.recognize(photo,'fra',{logger:m=>{if(m.status==='recognizing text')scanProgress(true,Math.round((m.progress||0)*100));}}),70000);
      text=(r&&r.data&&r.data.text)||'';
    }catch(e){
      scanProgress(false);
      toast('Lecture auto indisponible — l\'ordonnance est jointe, saisis à la main.');
      // repli : on ouvre quand même la fenêtre avec la photo
      scanReview({memberId:state.members[0].id,date:'',doctor:'',durN:0,durUnit:'',text:''},photo);
      return;
    }
    scanProgress(false);
    scanReview(parseRx(text),photo);
  });
}
function scanReview(p,photo){
  const meds=detectMeds(p.text||'');
  const memberOpts=state.members.map(m=>`<option value="${m.id}" ${m.id===p.memberId?'selected':''}>${esc(m.name)}</option>`).join('');
  const endPreview=p.durN?computeEnd(p.date||todayStr(),p.durN,p.durUnit):'';
  const medsHtml=meds.length?meds.map((m,i)=>`<label style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)"><input type="checkbox" data-medchk="${i}" checked style="width:auto;flex:none"><span>💊 <b>${esc(m.name)}</b> ${esc([m.dose&&(m.dose+' '+m.unit),m.perDay&&(m.perDay+'×/jour'),m.durationDays&&(m.durationDays+' j')].filter(Boolean).join(' · '))}</span></label>`).join(''):`<div class="hint">Aucun médicament détecté automatiquement (ordonnance manuscrite ou format inhabituel). Tu pourras les ajouter à la main.</div>`;
  const body=`
    <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px"><img src="${photo}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--border)"><div class="hint" style="flex:1">Vérifie et corrige les infos lues. ${p.memberId?'':'<b>Membre non reconnu</b> — choisis-le.'}</div></div>
    <div class="field"><label>Membre *</label><select id="sMember">${memberOpts}</select></div>
    <div class="field"><label>Intitulé</label><input id="sTitle" value="Ordonnance${p.date?' du '+esc(fmtDate(p.date)):''}"></div>
    <div class="row2"><div class="field"><label>Date de l'ordonnance</label><input type="date" id="sDate" value="${esc(p.date)||todayStr()}"></div><div class="field"><label>Fin (si durée)</label><input type="date" id="sEnd" value="${esc(endPreview)}"></div></div>
    <div class="field"><label>Médecin</label><input id="sDoctor" value="${esc(p.doctor)}" placeholder="Dr …"></div>
    <div class="field"><label>Médicaments détectés (à vérifier ⚠️)</label>${medsHtml}<div class="hint">Décoche ceux à ignorer. <b>Vérifie toujours les doses</b> sur l'ordonnance d'origine.</div></div>
    <div class="field"><label>Texte lu complet</label><textarea id="sText" rows="5" style="font-size:13px">${esc(p.text)}</textarea></div>`;
  const ov=openModal('Résultat du scan',body,async(ov)=>{
    const memberId=ov.querySelector('#sMember').value;
    const chosen=[];ov.querySelectorAll('[data-medchk]').forEach(c=>{if(c.checked)chosen.push(meds[+c.dataset.medchk]);});
    const desc=[ov.querySelector('#sDoctor').value?('Médecin : '+ov.querySelector('#sDoctor').value):'',ov.querySelector('#sText').value].filter(Boolean).join('\n\n');
    state.health.push({id:uid(),memberId,title:val(ov,'sTitle')||'Ordonnance',description:desc,startDate:ov.querySelector('#sDate').value||todayStr(),endDate:ov.querySelector('#sEnd').value,meds:chosen.map(m=>({name:m.name,dose:m.dose,unit:m.unit,perDay:m.perDay,durationDays:m.durationDays,notes:''})),rx:[photo]});
    await saveState();
    view={name:'member',id:memberId,tab:'sante'};setNav();render();
    toast('Ordonnance enregistrée');
  },'Enregistrer');
}

/* ---------------- Réglages ---------------- */
function settingsModal(){
  const s=state.settings||(state.settings={});const ec=s.emergencyContact||{};const notifOn=!!s.notif;
  const fileInfo=hasSaveFSA?'Chrome : enregistrement direct dans le fichier choisi':'Safari/iPhone : le fichier est téléchargé, à ranger dans iCloud/OneDrive';
  const body=`
    <div class="setrow"><div><div class="st">💾 Fichier de données (chiffré)</div><div class="sd">${fileInfo}</div></div><div style="white-space:nowrap"><button class="btn primary sm" id="sSave">Enregistrer</button> <button class="btn ghost sm" id="sOpen">Ouvrir</button></div></div>
    <div class="setrow"><div><div class="st">🔑 Mot de passe</div><div class="sd">Change le mot de passe de chiffrement</div></div><div><button class="btn ghost sm" id="sPw">Changer</button></div></div>
    <div class="setrow"><div><div class="st">🔔 Notifications</div><div class="sd">Rappels quand l'appli est ouverte</div></div><div><button class="btn ${notifOn?'ghost':'primary'} sm" id="toggleNotif">${notifOn?'Activées ✓':'Activer'}</button></div></div>
    <div class="field" style="margin-top:16px"><label>Contact d'urgence (nom)</label><input id="ecName" value="${esc(ec.name)}" placeholder="Ex : Marie (maman)"></div>
    <div class="field"><label>Contact d'urgence (téléphone)</label><input id="ecPhone" value="${esc(ec.phone)}" placeholder="Ex : 06 12 34 56 78"></div>
    <div class="hint">🔐 Tes données sont chiffrées (AES-256) avec ton mot de passe, sur cet appareil et dans le fichier. ⚠️ Si tu oublies le mot de passe, elles sont <b>définitivement irrécupérables</b> : note-le en lieu sûr.</div><div style="text-align:center;color:var(--muted);font-size:12px;margin-top:16px">Famio · v6</div>`;
  const ov=openModal('Réglages',body,async(ov)=>{s.emergencyContact={name:val(ov,'ecName'),phone:val(ov,'ecPhone')};await saveState();toast('Réglages enregistrés');});
  ov.querySelector('#sSave').onclick=()=>saveToFile();
  ov.querySelector('#sOpen').onclick=()=>{ov.remove();openFromFile();};
  ov.querySelector('#sPw').onclick=()=>showGate({title:'Nouveau mot de passe',sub:'Choisis un nouveau mot de passe. Note-le bien.',create:true,allowCancel:true,onSubmit:async(pw)=>{masterPw=pw;await saveState();toast('Mot de passe changé');return null;}});
  const tn=ov.querySelector('#toggleNotif');tn.onclick=async()=>{if(notifOn){s.notif=false;await saveState();ov.remove();settingsModal();return;}if(!('Notification'in window)){toast('Notifications non supportées ici');return;}const p=await Notification.requestPermission();if(p==='granted'){s.notif=true;await saveState();ov.remove();settingsModal();toast('Notifications activées');}else toast('Permission refusée');};
}

/* ---------------- Écran de déverrouillage / création ---------------- */
function showGate({title,sub,create,onSubmit,allowCancel,secondaryLabel,onSecondary}){
  const lk=document.createElement('div');lk.className='lock';
  lk.innerHTML=`<div class="logo">🔒</div><h2>${esc(title)}</h2>${sub?`<div style="color:var(--muted);max-width:340px;text-align:center;line-height:1.5">${esc(sub)}</div>`:''}
    <input id="g1" type="password" placeholder="Mot de passe" autocomplete="off">
    ${create?`<input id="g2" type="password" placeholder="Confirme le mot de passe" autocomplete="off">`:''}
    <div class="err" id="gErr"></div>
    <button class="btn primary" id="gOk" style="width:260px">${create?'Créer':'Déverrouiller'}</button>
    ${secondaryLabel?`<button class="btn soft" id="gSecond" style="width:260px">${esc(secondaryLabel)}</button>`:''}
    ${allowCancel?`<button class="btn ghost" id="gCancel" style="width:260px">Annuler</button>`:''}`;
  document.body.appendChild(lk);
  const i1=lk.querySelector('#g1');i1.focus();const err=lk.querySelector('#gErr');
  const submit=async()=>{const pw=i1.value;
    if(create){if(pw.length<4){err.textContent='4 caractères minimum';return;}if(pw!==lk.querySelector('#g2').value){err.textContent='Les mots de passe ne correspondent pas';return;}}
    else if(!pw){return;}
    const ok=lk.querySelector('#gOk');ok.disabled=true;const r=await onSubmit(pw);ok.disabled=false;
    if(r){err.textContent=r;i1.value='';if(lk.querySelector('#g2'))lk.querySelector('#g2').value='';}else lk.remove();
  };
  lk.querySelector('#gOk').onclick=submit;
  i1.onkeydown=e=>{if(e.key==='Enter')submit();};
  const i2=lk.querySelector('#g2');if(i2)i2.onkeydown=e=>{if(e.key==='Enter')submit();};
  const sc=lk.querySelector('#gSecond');if(sc)sc.onclick=()=>onSecondary();
  const cc=lk.querySelector('#gCancel');if(cc)cc.onclick=()=>lk.remove();
}

/* ---------------- Barre d'outils ---------------- */
document.getElementById('btnSettings').onclick=()=>settingsModal();
document.getElementById('btnSaveFile').onclick=()=>saveToFile();
document.getElementById('btnOpen').onclick=()=>openFromFile();

/* ---------------- Démarrage ---------------- */
(async()=>{
  if(!(window.crypto&&crypto.subtle)){document.getElementById('app').innerHTML='<div class="empty"><div class="big">⚠️</div>Ce navigateur ne permet pas le chiffrement en local. Ouvre le fichier dans Safari ou un Chrome récent.</div>';return;}
  const stored=await idbGet();
  if(!stored){
    showGate({title:'Protège tes données',sub:'Nouveau sur cet appareil ? Choisis un mot de passe pour démarrer. Tu as déjà un fichier (iCloud/OneDrive) ? Touche « J\'ai déjà un fichier ».',create:true,secondaryLabel:'📂 J\'ai déjà un fichier',onSecondary:openFromFile,onSubmit:async(pw)=>{masterPw=pw;state=JSON.parse(JSON.stringify(EMPTY));await saveState();render();return null;}});
  }else if(stored.enc){
    showGate({title:'Famio',sub:'Entre ton mot de passe',create:false,secondaryLabel:'📂 Ouvrir un fichier',onSecondary:openFromFile,onSubmit:async(pw)=>{try{const data=await decryptPkg(stored,pw);state=Object.assign(JSON.parse(JSON.stringify(EMPTY)),data);masterPw=pw;render();maybeNotify();return null;}catch(e){return 'Mot de passe incorrect';}}});
  }else{
    /* migration des données v3 (non chiffrées) */
    showGate({title:'Sécurise tes données',sub:'Tu as déjà des données. Choisis un mot de passe pour les chiffrer dès maintenant. Note-le bien.',create:true,onSubmit:async(pw)=>{masterPw=pw;state=Object.assign(JSON.parse(JSON.stringify(EMPTY)),stored);await saveState();render();return null;}});
  }
})();
</script>
